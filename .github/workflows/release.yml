name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            {
              echo "SIGNING_KEYSTORE_PATH=release.keystore"
              echo "SIGNING_STORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "SIGNING_KEY_ALIAS=$KEY_ALIAS"
              echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Building a signed release."
          else
            echo "No keystore secret configured; building an unsigned release."
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Set version
        run: |
          echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build release
        run: ./gradlew --no-daemon assembleRelease

      - name: Prepare artifact
        run: |
          mkdir -p artifacts
          VERSION="${GITHUB_REF_NAME#v}"
          for apk in app/build/outputs/apk/release/*.apk; do
            cp "$apk" "artifacts/OpenChat-${VERSION}-$(basename "$apk")"
          done
          ls -lh artifacts

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: openchat-release-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: OpenChat ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*.apk
          fail_on_unmatched_files: true
