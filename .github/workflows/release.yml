name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (for example 1.0.0 or v1.0.0)"
        required: true
        default: "1.0.0"
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The action's old default included the removed "tools" package.
          packages: ""

      - name: Install SDK platform
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            if [ ! -s release.keystore ]; then
              echo "ANDROID_KEYSTORE_BASE64 decoded to an empty file." >&2
              exit 1
            fi
            if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
              echo "ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD are required together." >&2
              exit 1
            fi
            {
              echo "SIGNING_KEYSTORE_PATH=release.keystore"
              echo "SIGNING_STORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "SIGNING_KEY_ALIAS=$KEY_ALIAS"
              echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Building with the configured release keystore."
          else
            echo "No keystore secret configured."
            echo "The release APK will be signed with the Android debug key so it can be installed."
            echo "Add the signing secrets for stable, updatable releases."
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Resolve version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RAW="$INPUT_VERSION"
          else
            RAW="$REF_NAME"
          fi
          RAW="$(printf '%s' "$RAW" | tr -d '[:space:]')"
          RAW="${RAW#refs/tags/}"
          VERSION="${RAW#v}"
          if [ -z "$VERSION" ]; then
            echo "A version is required." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version $VERSION"

      - name: Set version environment
        run: |
          echo "VERSION_NAME=${{ steps.version.outputs.version }}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build release
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify APK signature
        run: |
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "No release APK was produced." >&2
            exit 1
          fi
          echo "Verifying $APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Prepare artifact
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p artifacts
          for apk in app/build/outputs/apk/release/*.apk; do
            cp "$apk" "artifacts/OpenChat-${VERSION}-$(basename "$apk")"
          done
          ls -lh artifacts

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: openchat-release-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: OpenChat v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: artifacts/*.apk
          fail_on_unmatched_files: true
